[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rice_ml"
version = "0.1.0"
description = "description = "From-scratch machine learning algorithms with applied data analysis examples"
authors = [{ name = "Monica Liu", email = "zl115@rice.edu" }, { name = "Cynthia Liu", email = "cl160@rice.edu" }, { name = "Benjamin Mao", email = "bm68@rice.edu" }, { name = "Amy Xing", email = "ax15@rice.edu" }, { name = "Xinlin Wang", email = "sw107@rice.edu" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib", "seaborn", "pandas", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

# >>> These two lines make the src/ layout unambiguous <<<
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# [tool.pytest.ini_options]
# minversion = "6.0"
# addopts = "-ra -q"
# testpaths = ["tests"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
testpaths = ["src/rice_ml/supervised_learning", "tests"]
